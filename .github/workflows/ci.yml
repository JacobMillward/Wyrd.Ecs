name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0

      - name: Restore (locked mode)
        run: dotnet restore --locked-mode

      - name: Verify formatting
        run: dotnet format --verify-no-changes --no-restore

      - name: DEBUG build with generated output dumped
        run: dotnet build src/Core/Wyrd.Ecs.Tests/Wyrd.Ecs.Tests.csproj --no-restore --configuration Release /p:EmitCompilerGeneratedFiles=true /p:CompilerGeneratedFilesOutputPath=generated_debug || true

      - name: DEBUG list and show generated files
        if: always()
        run: |
          echo "=== generated_debug tree ==="
          find src/Core/Wyrd.Ecs.Tests/generated_debug -type f | sort || echo "NO GENERATED FILES DIR"
          echo "=== searching for PoisonSystem generated partial ==="
          grep -rl "PoisonSystem" src/Core/Wyrd.Ecs.Tests/generated_debug || echo "NOT FOUND ANYWHERE IN GENERATED OUTPUT"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release
